aid: hourone
name: Hourone
description: Hour One (developer surface "MakeReals") is an AI video-generation platform that turns text,
  scripts and data into studio-quality videos fronted by lifelike AI presenters (characters) and text-to-speech
  voices. Its REST API lets developers create videos programmatically two ways — from a Blueprint (an
  existing HourOne studio project/template) or Dynamically (scenes built from scratch with media, text,
  palette, character and voice) — preview voices, generate multi-language subtitles, pull usage analytics,
  manage API keys, and subscribe to video.ready / video.failed webhooks. The API is asynchronous (create,
  then poll by id or receive a signed webhook) and authenticates with a single api-key header. Common
  uses include personalized video at scale, L&D and training content, CRM/LMS automation, and localized
  marketing video. Hour One is a portfolio company of Kindred Ventures.
